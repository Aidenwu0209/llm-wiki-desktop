<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">LLM Wiki Desktop Icon</title>
  <desc id="desc">A premium macOS app icon showing an open structured wiki with connected research nodes.</desc>
  <defs>
