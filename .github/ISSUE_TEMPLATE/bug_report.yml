name: Bug report
description: Report a reproducible problem with LLM Wiki Desktop.
title: "[bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include API keys, private raw documents, or unredacted user data.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use synthetic or redacted data whenever possible.
      placeholder: |
        1. Open...
        2. Click...
        3. See...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0-rc1 or commit SHA
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dashboard
        - Raw sources / import
        - Runtime command
        - Provider adapter
        - Parser adapter
        - Query writeback
        - Obsidian handoff
        - Packaging
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Redact secrets, private paths, and raw document content.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed API keys, tokens, private raw documents, and private user data from this report.
          required: true
